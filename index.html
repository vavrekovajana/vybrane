<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DámTo! – Vybrané slová po B</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:12px;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin:2px;
}

.logo span{color:#ff9f1c}

.slogan{
  text-align:center;
  color:#718096;
  font-weight:700;
  margin-bottom:10px;
}

.card{
  background:white;
  border-radius:24px;
  padding:20px;
  box-shadow:0 15px 40px rgba(23,54,93,.12);
}

.center{text-align:center}
.hidden{display:none!important}

.levels{
  display:grid;
  gap:8px;
  margin:14px 0;
}

button{
  border:0;
  border-radius:16px;
  padding:11px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  border-color:#ff9f1c;
  background:#fff7e8;
}

.primary{
  width:100%;
  background:#2f80ed;
  color:white;
}

.mistakes{
  width:100%;
  margin-top:8px;
  background:#fff4df;
  color:#805400;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  background:#fff4df;
  padding:7px 11px;
  border-radius:30px;
  font-weight:800;
}

.progress{
  height:9px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0;
}

.bar{
  height:100%;
  width:0;
  background:#ff9f1c;
}

.stats{
  display:flex;
  justify-content:space-between;
  color:#65758b;
  font-weight:700;
  font-size:14px;
}

.instruction{
  margin-top:9px;
  color:#65758b;
  font-weight:700;
  font-size:15px;
}

.context{
  text-align:center;
  background:#f5f9ff;
  border-radius:14px;
  padding:8px 12px;
  margin-top:8px;
  font-size:17px;
  font-weight:700;
  color:#37536f;
}

.question{
  text-align:center;
  font-size:31px;
  font-weight:900;
  margin:11px 0;
}

.answers{
  display:grid;
  gap:7px;
}

.answer{
  background:white;
  border:2px solid #dce7f2;
  color:#17365d;
  padding:10px;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.feedback{
  margin-top:7px;
  padding:8px 11px;
  border-radius:14px;
  font-size:15px;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

.score{
  font-size:50px;
  font-weight:900;
  margin:12px;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:12px;
  margin-top:8px;
}

#next{
  margin-top:7px!important;
  padding:9px;
}

/* HRA SA ZMESTÍ NA OBRAZOVKU PC/NOTEBOOKU */
@media(min-width:521px){
  #game{
    padding:16px 20px;
  }

  #game .question{
    margin:9px 0;
  }

  #game .answer{

  }
}

/* MOBIL */
@media(max-width:520px){
  .wrap{padding:8px}

  .question{font-size:27px}

}

<div class="wrap">

<div class="logo">Dám<span>To!</span></div>
<div class="slogan">Každý deň o level vyššie.</div>

<!-- DOMOV -->

<section id="home" class="card center">

  <div style="font-size:42px">🐝</div>

  <h1 style="margin:6px 0">
    Vybrané slová po B
  </h1>

  <p style="margin:6px 0">
    Precvič si i/í a y/ý po B.
  </p>

    </button>

    <button

    </button>

    </button>

  </div>

  <button
    class="primary"

  </button>

  <button
    class="mistakes"

    🎯 Precvičiť moje chyby
    <span id="mistakeCount"></span>
  </button>

</section>


<!-- HRA -->

<section id="game" class="card hidden">

  <div class="top">

    <button
      class="secondary"

    </button>

    <div

    </div>

  </div>

  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

  <div class="stats">
    <span id="counter"></span>
    <span>🏆 <span id="points">0</span></span>
  </div>

  <div
    id="instruction"
    class="instruction">
  </div>

  <div
    id="context"
    class="context hidden">
  </div>

  <div
    id="question"
    class="question">
  </div>

  <div
    id="answers"
    class="answers">
  </div>

  <div id="feedback"></div>

  <button
    id="next"
    class="primary hidden"
    onclick="nextQuestion()">
    Ďalej ➜
  </button>

</section>


<!-- KONIEC -->

<section
  id="finish"
  class="card center hidden">

  <div style="font-size:55px">🏆</div>

  <h1>Tréning hotový!</h1>

  <div
    id="finalScore"
    class="score">
  </div>

  <p id="finalMessage"></p>

  <button
    class="primary"
    onclick="startTraining()">
    🔄 Nový náhodný mix
  </button>

  <br><br>

  <button
    class="secondary"
    onclick="goHome()">
    ⭐ Vybrať level
  </button>

</section>

<div class="footer">
  DámTo! • Vybrané slová po B
</div>

</div>

/* =====================================================
   PREMENNÉ
===================================================== */

let level=1;
let questions=[];
let current=0;
let score=0;
let locked=false;


/* =====================================================
   NÁHODNÉ PORADIE
===================================================== */

function shuffle(a){

  a=[...a];

  for(let i=a.length-1;i>0;i--){

    let j=Math.floor(
      Math.random()*(i+1)
    );

    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}


/* =====================================================
   LEVEL
===================================================== */

function chooseLevel(n,btn){

  level=n;

  document
    .querySelectorAll(".level")
    .forEach(
      b=>b.classList.remove("active")
    );

  btn.classList.add("active");
}


/* =====================================================
   OBRAZOVKY
===================================================== */

function show(id){

  ["home","game","finish"]
    .forEach(
      x=>
        document
          .getElementById(x)
          .classList
          .add("hidden")
    );

  document
    .getElementById(id)
    .classList
    .remove("hidden");

  window.scrollTo(0,0);
}


/* =====================================================
   CHYBY
===================================================== */

function getMistakes(){

  try{

    return JSON.parse(
      localStorage.getItem("damtoB") || "{}"
    );

  }catch(e){

    return {};

  }
}


function saveMistakes(x){

  localStorage.setItem(
    "damtoB",
    JSON.stringify(x)
  );

  updateMistakes();
}


function wrongAnswer(id){

  let m=getMistakes();

  m[id]=(m[id]||0)+1;

  saveMistakes(m);
}


function correctAnswer(id){

  let m=getMistakes();

  if(m[id]){

    m[id]--;

    if(m[id]<=0){
      delete m[id];
    }

    saveMistakes(m);
  }
}


function updateMistakes(){

  let n=
    Object.keys(
      getMistakes()
    ).length;

  document
    .getElementById("mistakeCount")
    .textContent=
      n ? "("+n+")" : "";
}


/* =====================================================
   MIX 5 I/Í + 5 Y/Ý
===================================================== */

function buildDeck(){

  let m=getMistakes();

  let yWords=
    database.filter(
      x=>
        x.correct==="y" ||
        x.correct==="ý"
    );

  let iWords=
    database.filter(
      x=>
        x.correct==="i" ||
        x.correct==="í"
    );

  yWords=[
    ...shuffle(
      yWords.filter(x=>m[x.id])
    ),
    ...shuffle(
      yWords.filter(x=>!m[x.id])
    )
  ];

  iWords=[
    ...shuffle(
      iWords.filter(x=>m[x.id])
    ),
    ...shuffle(
      iWords.filter(x=>!m[x.id])
    )
  ];

  return shuffle([
    ...yWords.slice(0,5),
    ...iWords.slice(0,5)
  ]);
}


/* =====================================================
   ŠTART
===================================================== */

function startTraining(){

  questions=buildDeck();

  current=0;
  score=0;

  show("game");

  render();
}


/* =====================================================
   MOJE CHYBY
===================================================== */

function startMistakes(){

  let m=getMistakes();

  let list=
    database.filter(
      x=>m[x.id]
    );

  if(!list.length){

    alert(
      "Zatiaľ nemáš uložené žiadne chyby. 🎉"
    );

    return;
  }

  questions=
    shuffle(list)
      .slice(0,10);

  current=0;
  score=0;

  show("game");

  render();
}


/* =====================================================
   DOMOV
===================================================== */

function goHome(){

  updateMistakes();

  show("home");
}


/* =====================================================
   OTÁZKA
===================================================== */

function render(){

  locked=false;

  if(current>=questions.length){

    finish();

    return;
  }

  let x=questions[current];

  let context=
    document.getElementById("context");

  context.textContent="";
  context.classList.add("hidden");

  document
    .getElementById("counter")
    .textContent=
      (current+1)
      +" / "+
      questions.length;

  document
    .getElementById("points")
    .textContent=
      score;

  document
    .getElementById("bar")
    .style.width=
      (
        current /
        questions.length *
        100
      )+"%";

  document
    .getElementById("feedback")
    .innerHTML="";

  document
    .getElementById("feedback")
    .className="";

  document
    .getElementById("next")
    .classList
    .add("hidden");

  document
    .getElementById("levelBadge")
    .textContent=
      level===1
      ? "⭐ Skúšam"
      : level===2
      ? "⭐⭐ Už mi to ide"
      : "⭐⭐⭐ DámTo!";


  /* ================= LEVEL 1 ================= */

  if(level===1){

    document
      .getElementById("instruction")
      .textContent=
        "✏️ Doplň správne písmeno";

    /*
       Pri slovách, kde sú obe podoby správne,
       zobrazíme významový kontext.
    */

    if(x.meaningPair && x.level2context){

      context.textContent=
        x.level2context;

      context.classList.remove("hidden");
    }

    document
      .getElementById("question")
      .textContent=
        x.gap;

    let wrong=

      x.correct==="i"
      ? "y"

      : x.correct==="í"
      ? "ý"

      : x.correct==="y"
      ? "i"

      : "í";

    createAnswers(
      [x.correct,wrong],
      x.correct
    );
  }


  /* ================= LEVEL 2 ================= */

  if(level===2){

    if(x.meaningPair){

      document
        .getElementById("instruction")
        .textContent=
          "🧩 Vyber slovo, ktoré patrí do vety";

      context.textContent=
        x.level2context;

      context.classList.remove("hidden");

      document
        .getElementById("question")
        .textContent=
          "Ktoré slovo doplníš?";

    }else{

      document
        .getElementById("instruction")
        .textContent=
          "🧩 Vyber správne napísané slovo";

      document
        .getElementById("question")
        .textContent=
          "Ktoré slovo je správne?";
    }

    createAnswers(
      [x.word,x.wrong],
      x.word
    );
  }


  /* ================= LEVEL 3 ================= */

  if(level===3){

    document
      .getElementById("instruction")
      .textContent=
        "🔎 Lovec chýb";

    document
      .getElementById("question")
      .textContent=
        "Ktorá veta je správna?";

    let good=
      shuffle(x.sentences)[0];

    let bad=
      good.replace(
        x.word,
        x.wrong
      );

    if(good===bad){

      current++;

      render();

      return;
    }

    createAnswers(
      [good,bad],
      good
    );
  }
}


/* =====================================================
   ODPOVEDE
===================================================== */

function createAnswers(options,correct){

  let box=
    document.getElementById("answers");

  box.innerHTML="";

  shuffle(options)
    .forEach(option=>{

      let b=
        document.createElement("button");

      b.className="answer";

      b.textContent=option;

      b.onclick=
        ()=>check(
          option===correct
        );

      box.appendChild(b);
    });
}


/* =====================================================
   KONTROLA
===================================================== */

function check(ok){

  if(locked)return;

  locked=true;

  let x=questions[current];

  let f=
    document.getElementById("feedback");

  if(ok){

    score++;

    correctAnswer(x.id);

    f.className=
      "feedback good";

    f.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }else{

    wrongAnswer(x.id);

    f.className=
      "feedback bad";

    /*
       Pri významových dvojiciach nehovoríme,
       že druhé slovo je nesprávne všeobecne.
    */

    if(x.meaningPair){

      f.innerHTML=
        "💡 <b>Ešte nie.</b> Do tejto vety patrí <b>"
        +x.word+
        "</b>.";

    }else{

      f.innerHTML=
        "💡 <b>Ešte nie.</b> Správne je <b>"
        +x.word+
        "</b>.";
    }
  }

  document
    .getElementById("points")
    .textContent=
      score;

  document
    .querySelectorAll(".answer")
    .forEach(
      b=>b.disabled=true
    );

  document
    .getElementById("next")
    .classList
    .remove("hidden");
}


/* =====================================================
   ĎALŠIA OTÁZKA
===================================================== */

function nextQuestion(){

  current++;

  render();

  window.scrollTo(0,0);
}


/* =====================================================
   ENTER = ĎALEJ
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Enter"){

      const nextButton=
        document.getElementById("next");

      const game=
        document.getElementById("game");

      if(
        nextButton &&
        game &&
        !nextButton.classList.contains("hidden") &&
        !game.classList.contains("hidden")
      ){

        event.preventDefault();

        nextQuestion();
      }
    }
  }
);


/* =====================================================
   KONIEC
===================================================== */

function finish(){

  document
    .getElementById("finalScore")
    .textContent=
      score+
      " / "+
      questions.length;

  let p=
    score /
    questions.length;

  document
    .getElementById("finalMessage")
    .textContent=

      p===1
      ? "Perfektné! Bez chyby. 🌟"

      : p>=.8
      ? "Výborne! 🚀"

      : p>=.6
      ? "Pekná práca. 💪"

      : "Skús ešte jeden tréning. 🌱";

  updateMistakes();

  show("finish");
}


/* =====================================================
   SPUSTENIE
===================================================== */

updateMistakes();

</script>
